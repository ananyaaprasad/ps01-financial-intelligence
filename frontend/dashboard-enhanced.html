<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

const BASE_STOCKS = [
  { ticker: "RELIANCE", name: "Reliance Industries", sector: "Energy", price: 2468.50, rsi: 58.4, pe: 24.5 },
  { ticker: "TCS", name: "Tata Consultancy Services", sector: "IT", price: 3845.20, rsi: 52.1, pe: 28.2 },
  { ticker: "INFY", name: "Infosys Ltd", sector: "IT", price: 1534.80, rsi: 44.6, pe: 22.8 },
  { ticker: "HDFCBANK", name: "HDFC Bank Ltd", sector: "Banking", price: 1692.10, rsi: 61.2, pe: 18.4 },
  { ticker: "ICICIBANK", name: "ICICI Bank Ltd", sector: "Banking", price: 985.40, rsi: 63.8, pe: 16.8 },
  { ticker: "TATAMOTORS", name: "Tata Motors Ltd", sector: "Auto", price: 632.75, rsi: 72.4, pe: 14.2 },
  { ticker: "BHARTIARTL", name: "Bharti Airtel Ltd", sector: "Telecom", price: 1158.00, rsi: 54.0, pe: 32.0 },
  { ticker: "ITC", name: "ITC Ltd", sector: "FMCG", price: 442.15, rsi: 48.2, pe: 26.5 },
  { ticker: "WIPRO", name: "Wipro Ltd", sector: "IT", price: 548.30, rsi: 38.5, pe: 21.0 },
  { ticker: "SBIN", name: "State Bank of India", sector: "Banking", price: 754.60, rsi: 59.0, pe: 10.5 }
];

const USER_PROFILES = {
  conservative: {
    id: "user_conservative",
    name: "Aarav Sharma",
    persona: "Conservative (Capital Preservation)",
    riskTolerance: "conservative",
    portfolioValue: 1500000,
    cash: 450000,
    weights: { fundamentals: 55, sentiment: 25, momentum: 20 },
    holdings: [
      { ticker: "ITC", shares: 1200, avg: 410.0, current: 442.15, pnlPct: 7.84 },
      { ticker: "TCS", shares: 150, avg: 3650.0, current: 3845.20, pnlPct: 5.35 },
      { ticker: "HDFCBANK", shares: 200, avg: 1580.0, current: 1692.10, pnlPct: 7.10 }
    ]
  },
  moderate: {
    id: "user_moderate",
    name: "Priya Patel",
    persona: "Moderate (Balanced Growth)",
    riskTolerance: "moderate",
    portfolioValue: 800000,
    cash: 180000,
    weights: { fundamentals: 35, sentiment: 35, momentum: 30 },
    holdings: [
      { ticker: "RELIANCE", shares: 120, avg: 2380.0, current: 2468.50, pnlPct: 3.72 },
      { ticker: "INFY", shares: 180, avg: 1480.0, current: 1534.80, pnlPct: 3.70 },
      { ticker: "TATAMOTORS", shares: 300, avg: 580.0, current: 632.75, pnlPct: 9.10 }
    ]
  },
  aggressive: {
    id: "user_aggressive",
    name: "Rohan Verma",
    persona: "Aggressive (High-Beta Momentum)",
    riskTolerance: "aggressive",
    portfolioValue: 400000,
    cash: 90000,
    weights: { momentum: 50, sentiment: 30, fundamentals: 20 },
    holdings: [
      { ticker: "TATAMOTORS", shares: 450, avg: 560.0, current: 632.75, pnlPct: 12.99 },
      { ticker: "SBIN", shares: 250, avg: 710.0, current: 754.60, pnlPct: 6.28 },
      { ticker: "BHARTIARTL", shares: 150, avg: 1080.0, current: 1158.00, pnlPct: 7.22 }
    ]
  }
};

function simulateMarketTick(basePrice, tickCount) {
  const volatility = 0.02;
  const drift = 0.0005 * tickCount;
  const randomWalk = (Math.random() - 0.5) * volatility;
  return basePrice * (1 + drift + randomWalk);
}

function PriceChart({ data, isDark }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  useEffect(() => {
    if (!canvasRef.current || !data || data.length === 0) return;
    const ctx = canvasRef.current.getContext('2d');
    if (chartRef.current) chartRef.current.destroy();

    const textColor = isDark ? '#94a3b8' : '#64748b';
    const gridColor = isDark ? '#1f293d' : '#e2e8f0';
    const lineColor = isDark ? '#3b82f6' : '#2563eb';

    chartRef.current = new Chart(ctx, {
      type: 'line',
      data: {
        labels: data.map((_, i) => `T${i}`),
        datasets: [{
          label: 'Price',
          data: data,
          borderColor: lineColor,
          backgroundColor: isDark ? 'rgba(59, 130, 246, 0.1)' : 'rgba(37, 99, 235, 0.1)',
          borderWidth: 2,
          fill: true,
          tension: 0.4,
          pointRadius: 0,
          pointHoverRadius: 4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: isDark ? '#111827' : '#ffffff',
            titleColor: textColor,
            bodyColor: textColor,
            borderColor: gridColor,
            borderWidth: 1
          }
        },
        scales: {
          x: {
            display: true,
            grid: { color: gridColor },
            ticks: { color: textColor, maxTicksLimit: 10 }
          },
          y: {
            display: true,
            grid: { color: gridColor },
            ticks: { color: textColor }
          }
        }
      }
    });

    return () => {
      if (chartRef.current) chartRef.current.destroy();
    };
  }, [data, isDark]);

  return <canvas ref={canvasRef} />;
}

function AgentPieChart({ weights, isDark }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  useEffect(() => {
    if (!canvasRef.current || !weights) return;
    const ctx = canvasRef.current.getContext('2d');
    if (chartRef.current) chartRef.current.destroy();

    const textColor = isDark ? '#94a3b8' : '#64748b';

    chartRef.current = new Chart(ctx, {
      type: 'pie',
      data: {
        labels: ['Momentum', 'Sentiment', 'Fundamentals'],
        datasets: [{
          data: [weights.momentum, weights.sentiment, weights.fundamentals],
          backgroundColor: [
            isDark ? 'rgba(245, 158, 11, 0.8)' : 'rgba(217, 119, 6, 0.8)',
            isDark ? 'rgba(168, 85, 247, 0.8)' : 'rgba(147, 51, 234, 0.8)',
            isDark ? 'rgba(59, 130, 246, 0.8)' : 'rgba(37, 99, 235, 0.8)'
          ],
          borderColor: isDark ? '#111827' : '#ffffff',
          borderWidth: 2
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            display: true,
            position: 'bottom',
            labels: {
              color: textColor,
              font: { size: 11 },
              padding: 10
            }
          },
          tooltip: {
            backgroundColor: isDark ? '#111827' : '#ffffff',
            titleColor: textColor,
            bodyColor: textColor,
            borderColor: isDark ? '#1f293d' : '#e2e8f0',
            borderWidth: 1,
            callbacks: {
              label: function(context) {
                return context.label + ': ' + context.parsed + '%';
              }
            }
          }
        }
      }
    });

    return () => {
      if (chartRef.current) chartRef.current.destroy();
    };
  }, [weights, isDark]);

  return <canvas ref={canvasRef} />;
}

function App() {
  const [selectedTicker, setSelectedTicker] = useState("TATAMOTORS");
  const [selectedProfileKey, setSelectedProfileKey] = useState("moderate");
  const [expandedTrace, setExpandedTrace] = useState(null);
  const [tickCount, setTickCount] = useState(1);
  const [stocks, setStocks] = useState(BASE_STOCKS.map(s => ({ ...s, change: 0, priceHistory: [s.price] })));
  const [theme, setTheme] = useState(() => {
    if (typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      return 'dark';
    }
    return 'light';
  });

  const currentStock = useMemo(() => {
    return stocks.find(s => s.ticker === selectedTicker) || stocks[0];
  }, [selectedTicker, stocks]);

  const currentProfile = USER_PROFILES[selectedProfileKey];

  useEffect(() => {
    if (typeof document !== 'undefined') {
      document.documentElement.setAttribute('data-theme', theme);
    }
  }, [theme]);

  const incrementTick = () => {
    setTickCount(prev => Math.min(prev + 1, 100));
    setStocks(prevStocks => prevStocks.map(stock => {
      const baseStock = BASE_STOCKS.find(s => s.ticker === stock.ticker);
      const newPrice = simulateMarketTick(baseStock.price, tickCount + 1);
      const change = ((newPrice - baseStock.price) / baseStock.price) * 100;
      const newHistory = [...stock.priceHistory, newPrice];
      if (newHistory.length > 50) newHistory.shift();
      return { ...stock, price: newPrice, change, priceHistory: newHistory };
    }));
  };

  const decrementTick = () => {
    if (tickCount <= 1) return;
    setTickCount(prev => prev - 1);
    setStocks(prevStocks => prevStocks.map(stock => {
      const baseStock = BASE_STOCKS.find(s => s.ticker === stock.ticker);
      const newPrice = simulateMarketTick(baseStock.price, tickCount - 1);
      const change = ((newPrice - baseStock.price) / baseStock.price) * 100;
      const newHistory = stock.priceHistory.slice(0, -1);
      return { ...stock, price: newPrice, change, priceHistory: newHistory.length > 0 ? newHistory : [newPrice] };
    }));
  };

  const traces = useMemo(() => [
    {
      agentId: "momentum_tech_agent_01",
      dimension: "MOMENTUM_TECHNICAL",
      title: "Momentum & Technical Agent",
      icon: "📈",
      signal: tickCount > 5 ? "STRONG_BUY" : "BUY",
      confidence: Math.min(0.88 + (tickCount * 0.01), 0.95),
      claim: `${selectedTicker} displays strong volume surge (2.4x) with bullish MACD crossover and RSI at ${currentStock.rsi.toFixed(1)}.`,
      reasoning: `Price action is trading above 20-day and 50-day moving averages. Volume surge indicates active institutional accumulation. Breakout above Bollinger upper band confirms momentum continuation.`,
      sources: [
        `RSI(14): ${currentStock.rsi.toFixed(2)}`,
        `20-day Volume Surge: 2.42x`,
        `MACD Histogram: +0.48 (Bullish expansion)`,
        `SMA Position: Price > SMA20 > SMA50 > SMA200`
      ],
      latencyMs: 4.8 + (Math.random() * 2)
    },
    {
      agentId: "sentiment_rag_agent_01",
      dimension: "SENTIMENT_RAG",
      title: "Sentiment & Filing RAG Agent",
      icon: "📑",
      signal: tickCount > 3 ? "BUY" : "HOLD",
      confidence: Math.min(0.85 + (tickCount * 0.008), 0.92),
      claim: `Management commentary in Q2 earnings and regulatory disclosures reflects strong demand recovery and margin expansion guidance.`,
      reasoning: `RAG retrieval extracted 4 high-relevance chunks from Q2 investor transcript. Key sentiment markers highlighted 22% YoY revenue growth, EV volume doubling, and debt reduction progress of ₹7,600 Cr.`,
      sources: [
        `Q2 FY27 Earnings Call Transcript (Chunk 0012) [Similarity: 0.89]: "EV sales crossed 18,000 units growing 85% YoY with expanding margins."`,
        `Investor Presentation (Chunk 0014) [Similarity: 0.84]: "Free cash flow generation of ₹5,800 Cr supported net automotive debt reduction."`,
        `Regulation 30 Material Disclosure: "Commercial vehicle order book visibility at 6 months."`
      ],
      latencyMs: 6.2 + (Math.random() * 3)
    },
    {
      agentId: "fundamentals_risk_agent_01",
      dimension: "FUNDAMENTALS_RISK",
      title: "Fundamentals & SEBI Compliance Agent",
      icon: "🏛️",
      signal: tickCount > 10 ? "HOLD" : "STRONG_BUY",
      confidence: Math.max(0.91 - (tickCount * 0.005), 0.65),
      claim: `Attractive valuation at ${currentStock.pe}x P/E with pristine SEBI LODR compliance score (9.4/10) and low promoter pledge.`,
      reasoning: `Return on Capital Employed (RoCE) stands at 18.2% with interest coverage ratio of 4.8x. Balance sheet deleveraging trajectory is credible under current operating cash flow.`,
      sources: [
        `P/E Ratio: ${currentStock.pe}x (Industry benchmark: 22.4x)`,
        `RoE / RoCE: 22.4% / 18.2%`,
        `SEBI LODR Compliance Audit: Score 9.4/10 (Zero regulatory penalties)`,
        `Promoter Pledge: 1.8% (Well within SEBI safe threshold of < 10%)`
      ],
      latencyMs: 3.5 + (Math.random() * 2)
    }
  ], [selectedTicker, tickCount, currentStock]);

  const synthesizedResult = useMemo(() => {
    const weights = currentProfile.weights;
    const agentSignals = {
      momentum: traces[0].signal === "STRONG_BUY" ? 1 : traces[0].signal === "BUY" ? 0.5 : 0,
      sentiment: traces[1].signal === "BUY" ? 0.5 : 0,
      fundamentals: traces[2].signal === "STRONG_BUY" ? 1 : traces[2].signal === "HOLD" ? 0 : 0.5
    };

    const compositeScore = (
      agentSignals.momentum * (weights.momentum / 100) * traces[0].confidence +
      agentSignals.sentiment * (weights.sentiment / 100) * traces[1].confidence +
      agentSignals.fundamentals * (weights.fundamentals / 100) * traces[2].confidence
    );

    const overallSignal = compositeScore >= 0.4 ? "BUY" : compositeScore >= 0.25 ? "HOLD" : "SELL";
    const compositeConfidence = Math.abs(compositeScore);
    const allocationPct = currentProfile.riskTolerance === "aggressive" ? 14.5 : currentProfile.riskTolerance === "moderate" ? 8.0 : 3.5;

    return {
      overallSignal,
      compositeConfidence,
      suggestedAllocation: allocationPct,
      personalizedRationale: currentProfile.riskTolerance === "conservative"
        ? `Tailored for CONSERVATIVE profile: Emphasized fundamental debt coverage and governance (55% weight). High-volatility technical momentum was dampened to preserve capital.`
        : currentProfile.riskTolerance === "aggressive"
        ? `Tailored for AGGRESSIVE profile: Prioritized volume anomaly and momentum breakout signals (50% weight) to maximize upside capture.`
        : `Tailored for MODERATE profile: Balanced tripartite synthesis across fundamentals (35%), filing sentiment RAG (35%), and technical momentum (30%).`,
      traces
    };
  }, [currentProfile, traces]);

  const getSignalBadge = (sig) => {
    if (sig.includes("STRONG_BUY")) return <span className="px-2.5 py-1 rounded text-xs font-bold font-mono-nums bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 border border-emerald-500/30">STRONG BUY</span>;
    if (sig.includes("BUY")) return <span className="px-2.5 py-1 rounded text-xs font-bold font-mono-nums bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 border border-emerald-500/30">BUY</span>;
    if (sig.includes("SELL")) return <span className="px-2.5 py-1 rounded text-xs font-bold font-mono-nums bg-red-500/15 text-red-600 dark:text-red-400 border border-red-500/30">SELL</span>;
    return <span className="px-2.5 py-1 rounded text-xs font-bold font-mono-nums bg-slate-500/15 text-slate-600 dark:text-slate-400 border border-slate-500/30">HOLD</span>;
  };

  return (
    <div className="min-h-screen flex flex-col" style={{ backgroundColor: "var(--bg-base)" }}>
      {/* Top Header */}
      <header className="border-b px-6 py-3.5 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-30 backdrop-blur" style={{ backgroundColor: "var(--bg-card)", borderColor: "var(--border)" }}>
        <div className="flex items-center gap-3">
          <div className="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold text-lg shadow-sm">⚡</div>
          <div>
            <div className="flex items-center gap-2">
              <h1 className="font-heading font-bold text-lg tracking-tight">Antigravity Financial Intelligence</h1>
              <span className="badge-simulated text-[10px] px-2 py-0.5 rounded-full font-mono uppercase tracking-wider">SIMULATED DATA</span>
            </div>
            <p className="text-xs text-slate-500 dark:text-slate-400">PS-01: Multi-Agent Autonomous Financial Intelligence</p>
          </div>
        </div>

        <div className="flex items-center gap-3">
          <button
            onClick={() => setTheme(prev => prev === 'dark' ? 'light' : 'dark')}
            className="px-3 py-1.5 rounded-md text-xs font-medium border transition-colors"
            style={{ backgroundColor: "var(--bg-card-muted)", borderColor: "var(--border)" }}
          >
            {theme === 'dark' ? '☀️' : '🌙'} {theme === 'dark' ? 'Light' : 'Dark'}
          </button>
        </div>
      </header>

      {/* Ticker Stream Ribbon */}
      <div className="border-b overflow-x-auto py-2 px-6 flex items-center gap-4 text-xs font-mono-nums custom-scrollbar" style={{ backgroundColor: "var(--bg-card-muted)", borderColor: "var(--border)" }}>
        <span className="text-slate-400 uppercase text-[10px] font-bold tracking-wider shrink-0">MARKET FEED:</span>
        {stocks.map(s => (
          <button
            key={s.ticker}
            onClick={() => setSelectedTicker(s.ticker)}
            className={`shrink-0 flex items-center gap-2 px-2.5 py-1 rounded border transition-all ${selectedTicker === s.ticker ? 'border-blue-500 bg-blue-50/50 dark:bg-blue-900/20 font-bold' : 'border-transparent hover:border-slate-300 dark:hover:border-slate-700'}`}
          >
            <span>{s.ticker}</span>
            <span className="text-slate-600 dark:text-slate-300">₹{s.price.toFixed(2)}</span>
            <span className={s.change >= 0 ? "text-emerald-500" : "text-red-500"}>
              {s.change >= 0 ? "+" : ""}{s.change.toFixed(2)}%
            </span>
          </button>
        ))}
      </div>

      {/* Main Dashboard Body */}
      <main className="flex-1 p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 max-w-[1600px] w-full mx-auto">
        {/* Left Column (4 cols) */}
        <div className="lg:col-span-4 space-y-6">
          {/* Tick Control Card */}
          <div className="rounded-xl border p-5 shadow-sm" style={{ backgroundColor: "var(--bg-card)", borderColor: "var(--border)" }}>
            <h3 className="font-heading font-bold text-sm mb-3">Market Tick Control</h3>
            <p className="text-xs text-slate-500 mb-4">Simulate market progression and observe agent adaptation</p>

            <div className="flex items-center justify-center gap-4 mb-4">
              <button
                onClick={decrementTick}
                disabled={tickCount <= 1}
                className="px-4 py-2 rounded-lg border font-bold text-lg transition-colors disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-100 dark:hover:bg-slate-800"
                style={{ borderColor: "var(--border)" }}
              >
                −
              </button>
              <div className="text-center">
                <div className="text-xs text-slate-400 uppercase font-mono">Tick Count</div>
                <div className="text-3xl font-bold font-mono-nums text-blue-600 dark:text-blue-400">{tickCount}</div>
              </div>
              <button
                onClick={incrementTick}
                disabled={tickCount >= 100}
                className="px-4 py-2 rounded-lg border font-bold text-lg transition-colors disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-100 dark:hover:bg-slate-800"
                style={{ borderColor: "var(--border)" }}
              >
                +
              </button>
            </div>
          </div>

          {/* User Profile Switcher Card */}
          <div className="rounded-xl border p-5 shadow-sm" style={{ backgroundColor: "var(--bg-card)", borderColor: "var(--border)" }}>
            <h3 className="font-heading font-bold text-sm mb-3">Investor Profile Selection</h3>
            <p className="text-xs text-slate-500 mb-4">Switch profile to demonstrate dynamic weight redistribution</p>

            <div className="grid grid-cols-3 gap-2 mb-4">
              {Object.entries(USER_PROFILES).map(([key, prof]) => (
                <button
                  key={key}
                  onClick={() => setSelectedProfileKey(key)}
                  className={`p-2.5 rounded-lg border text-left transition-all ${selectedProfileKey === key ? 'border-blue-600 bg-blue-50 dark:bg-blue-900/20 ring-1 ring-blue-600' : 'border-slate-200 dark:border-slate-700 hover:border-slate-300'}`}
                >
                  <div className="font-bold text-xs capitalize">{key}</div>
                  <div className="text-[10px] text-slate-500 truncate">{prof.name}</div>
                </button>
              ))}
            </div>

            {/* Active Profile Specs */}
            <div className="p-3 rounded-lg border text-xs space-y-2" style={{ backgroundColor: "var(--bg-card-muted)", borderColor: "var(--border)" }}>
              <div className="flex justify-between font-medium">
                <span className="text-slate-500">Selected User:</span>
                <span className="font-semibold">{currentProfile.name}</span>
              </div>
              <div className="flex justify-between">
                <span className="text-slate-500">Portfolio Value:</span>
                <span className="font-mono-nums font-semibold">₹{currentProfile.portfolioValue.toLocaleString()}</span>
              </div>
              <div className="pt-2 border-t text-[11px] space-y-1" style={{ borderColor: "var(--border)" }}>
                <div className="text-slate-400 uppercase font-bold text-[9px] tracking-wider">Agent Synthesis Weights</div>
                <div className="flex justify-between font-mono-nums">
                  <span>🏛️ Fundamentals:</span>
                  <span className="font-bold text-blue-600 dark:text-blue-400">{currentProfile.weights.fundamentals}%</span>
                </div>
                <div className="flex justify-between font-mono-nums">
                  <span>📑 Sentiment:</span>
                  <span className="font-bold text-purple-600 dark:text-purple-400">{currentProfile.weights.sentiment}%</span>
                </div>
                <div className="flex justify-between font-mono-nums">
                  <span>📈 Momentum:</span>
                  <span className="font-bold text-amber-600 dark:text-amber-400">{currentProfile.weights.momentum}%</span>
                </div>
              </div>
            </div>
          </div>

          {/* Agent Weight Distribution Pie Chart */}
          <div className="rounded-xl border p-5 shadow-sm" style={{ backgroundColor: "var(--bg-card)", borderColor: "var(--border)" }}>
            <h3 className="font-heading font-bold text-sm mb-3">Agent Weight Distribution</h3>
            <p className="text-xs text-slate-500 mb-4">Risk-based synthesis weighting for {currentProfile.name}</p>
            <div style={{ height: '240px' }}>
              <AgentPieChart weights={currentProfile.weights} isDark={theme === 'dark'} />
            </div>
          </div>

          {/* User Portfolio Holdings */}
          <div className="rounded-xl border p-5 shadow-sm" style={{ backgroundColor: "var(--bg-card)", borderColor: "var(--border)" }}>
            <h3 className="font-heading font-bold text-sm mb-3">Portfolio Holdings</h3>
            <div className="space-y-2 font-mono-nums text-xs">
              {currentProfile.holdings.map(h => (
                <div key={h.ticker} className="flex items-center justify-between p-2 rounded border" style={{ backgroundColor: "var(--bg-card-muted)", borderColor: "var(--border)" }}>
                  <div>
                    <div className="font-bold">{h.ticker}</div>
                    <div className="text-[10px] text-slate-500">{h.shares} shares @ ₹{h.avg}</div>
                  </div>
                  <div className="text-right">
                    <div className="font-semibold">₹{(h.shares * h.current).toLocaleString()}</div>
                    <div className={`text-[10px] font-bold ${h.pnlPct >= 0 ? 'text-emerald-500' : 'text-red-500'}`}>
                      {h.pnlPct >= 0 ? "+" : ""}{h.pnlPct}%
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* Right Column (8 cols) */}
        <div className="lg:col-span-8 space-y-6">
          {/* Price Trend Chart */}
          <div className="rounded-xl border p-5 shadow-sm" style={{ backgroundColor: "var(--bg-card)", borderColor: "var(--border)" }}>
            <h3 className="font-heading font-bold text-sm mb-3">Price Trend - {currentStock.name} ({currentStock.ticker})</h3>
            <p className="text-xs text-slate-500 mb-4">Historical price movement across {tickCount} tick{tickCount !== 1 ? 's' : ''}</p>
            <div style={{ height: '240px' }}>
              <PriceChart data={currentStock.priceHistory} isDark={theme === 'dark'} />
            </div>
          </div>

          {/* Top Synthesized Recommendation Hero Card */}
          <div className="rounded-xl border p-6 shadow-sm" style={{ backgroundColor: "var(--bg-card)", borderColor: "var(--border)" }}>
            <div className="flex flex-wrap items-center justify-between gap-4 mb-4">
              <div>
                <span className="text-xs font-mono uppercase text-slate-400 tracking-wider">SYNTHESIS ORCHESTRATOR VERDICT</span>
                <div className="flex items-center gap-3 mt-1">
                  <h2 className="font-heading font-extrabold text-2xl tracking-tight">{currentStock.name} ({currentStock.ticker})</h2>
                  {getSignalBadge(synthesizedResult.overallSignal)}
                </div>
              </div>

              <div className="flex items-center gap-4 text-right">
                <div>
                  <div className="text-[11px] text-slate-400 uppercase font-mono">Composite Confidence</div>
                  <div className="text-2xl font-bold font-mono-nums text-blue-600 dark:text-blue-400">
                    {(synthesizedResult.compositeConfidence * 100).toFixed(1)}%
                  </div>
                </div>
                <div>
                  <div className="text-[11px] text-slate-400 uppercase font-mono">Suggested Allocation</div>
                  <div className="text-2xl font-bold font-mono-nums text-emerald-600 dark:text-emerald-400">
                    {synthesizedResult.suggestedAllocation}%
                  </div>
                </div>
              </div>
            </div>

            {/* Personalized Rationale */}
            <div className="p-3.5 rounded-lg border text-xs leading-relaxed" style={{ backgroundColor: "var(--bg-card-muted)", borderColor: "var(--border)" }}>
              <span className="font-bold text-blue-600 dark:text-blue-400">Personalized Strategy: </span>
              {synthesizedResult.personalizedRationale}
            </div>
          </div>

          {/* Uncollapsed Multi-Agent Reasoning Trace */}
          <div className="rounded-xl border p-6 shadow-sm" style={{ backgroundColor: "var(--bg-card)", borderColor: "var(--border)" }}>
            <div className="flex items-center justify-between mb-4">
              <div>
                <h3 className="font-heading font-bold text-base">Uncollapsed Agent Reasoning Trace</h3>
                <p className="text-xs text-slate-500">Complete explainability chain — see each specialized agent's independent reasoning & citations</p>
              </div>
              <span className="text-xs px-2.5 py-1 rounded-full bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 font-mono font-bold">
                3 Agents Parallel
              </span>
            </div>

            <div className="space-y-4">
              {synthesizedResult.traces.map((trace, idx) => (
                <div
                  key={trace.agentId}
                  className="rounded-xl border transition-all"
                  style={{ backgroundColor: "var(--bg-card)", borderColor: "var(--border)" }}
                >
                  <div
                    onClick={() => setExpandedTrace(expandedTrace === idx ? null : idx)}
                    className="p-4 flex items-center justify-between cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors rounded-xl"
                  >
                    <div className="flex items-center gap-3">
                      <span className="text-2xl">{trace.icon}</span>
                      <div>
                        <div className="flex items-center gap-2">
                          <span className="font-heading font-bold text-sm">{trace.title}</span>
                          {getSignalBadge(trace.signal)}
                        </div>
                        <p className="text-xs text-slate-500 line-clamp-1 mt-0.5">{trace.claim}</p>
                      </div>
                    </div>

                    <div className="flex items-center gap-4 font-mono-nums text-xs">
                      <div className="text-right">
                        <div className="text-slate-400 text-[10px]">CONFIDENCE</div>
                        <div className="font-bold">{(trace.confidence * 100).toFixed(0)}%</div>
                      </div>
                      <div className="text-right">
                        <div className="text-slate-400 text-[10px]">LATENCY</div>
                        <div className="text-slate-500">{trace.latencyMs.toFixed(1)}ms</div>
                      </div>
                      <span className="text-slate-400 text-sm">{expandedTrace === idx ? "▲" : "▼"}</span>
                    </div>
                  </div>

                  {/* Expandable Reasoning & Citations Body */}
                  {expandedTrace === idx && (
                    <div className="px-4 pb-4 pt-1 border-t text-xs space-y-3" style={{ borderColor: "var(--border)" }}>
                      <div>
                        <div className="text-[10px] font-bold uppercase text-slate-400 tracking-wider mb-1 font-mono">Step-by-Step Reasoning</div>
                        <p className="text-slate-700 dark:text-slate-300 leading-relaxed bg-slate-50 dark:bg-slate-900/50 p-3 rounded-lg border" style={{ borderColor: "var(--border)" }}>
                          {trace.reasoning}
                        </p>
                      </div>

                      <div>
                        <div className="text-[10px] font-bold uppercase text-slate-400 tracking-wider mb-1 font-mono">Cited Sources & Evidence</div>
                        <ul className="space-y-1 font-mono text-[11px] text-slate-600 dark:text-slate-400">
                          {trace.sources.map((src, sIdx) => (
                            <li key={sIdx} className="p-2 rounded bg-slate-100/70 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 flex items-start gap-2">
                              <span className="text-blue-500 font-bold shrink-0">[{sIdx + 1}]</span>
                              <span>{src}</span>
                            </li>
                          ))}
                        </ul>
                      </div>
                    </div>
                  )}
                </div>
              ))}
            </div>
          </div>
        </div>
      </main>

      {/* Footer */}
      <footer className="border-t py-4 px-6 text-center text-xs text-slate-500 font-mono" style={{ backgroundColor: "var(--bg-card)", borderColor: "var(--border)" }}>
        PS-01: Multi-Agent Autonomous Financial Intelligence System • Built for 24h Hackathon • All Data Clearly Marked as SIMULATED
      </footer>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
